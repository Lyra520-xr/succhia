<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>沈行川</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #top {
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 16px;
      font-weight: 600;
      background: #151515;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 13px;
      margin: 8px 0;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .me {
      margin-left: auto;
      background: #333;
    }

    .him {
      margin-right: auto;
      background: #1d1d1d;
      border: 1px solid #303030;
    }

    #composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid #2a2a2a;
      background: #151515;
    }

    #input {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      border-radius: 18px;
      padding: 10px 13px;
      background: #292929;
      color: white;
      font-size: 16px;
      min-height: 42px;
      max-height: 120px;
    }

    #send {
      border: 0;
      border-radius: 18px;
      padding: 0 16px;
      background: white;
      color: black;
      font-weight: 600;
    }

    #send:disabled {
      opacity: .45;
    }

    .status {
      opacity: .55;
      font-size: 13px;
      padding: 4px 2px;
    }
  </style>
</head>

<body>
  <div id="top">沈行川</div>

  <div id="messages">
    <div class="msg him">君一。过来，今天想跟我说什么？</div>
  </div>

  <div id="composer">
    <textarea id="input" rows="1" placeholder="说点什么……"></textarea>
    <button id="send">发送</button>
  </div>

<script>
const API = "https://succhia.onrender.com/chat";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "me");
  input.value = "";
  send.disabled = true;

  const waiting = addMessage("……", "him");

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json; charset=utf-8"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.error || "请求失败");
    }

    waiting.textContent = data.reply || "嗯。";

  } catch (err) {
    waiting.textContent = "连接出了点问题：" + err.message;
  } finally {
    send.disabled = false;
    input.focus();
    messages.scrollTop = messages.scrollHeight;
  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
